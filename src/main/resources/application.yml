server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cache-lab
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:400ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:400ms}
  cache:
    type: redis

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

cachelab:
  instance-id: ${INSTANCE_ID:${SERVER_PORT:8080}}
  simulated-db-delay: ${CACHELAB_DB_DELAY:1200ms}
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/cachelab
    username: cachelab
    password: cachelab
  cache:
    product-ttl: ${CACHELAB_CACHE_TTL:60s}

logging:
  level:
    com.cigdem.cachelab: INFO
